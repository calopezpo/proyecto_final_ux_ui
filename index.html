<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiProgreso - Dashboard</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <header class="main-header">
        <!-- Checkbox invisible para controlar el menú hamburguesa por CSS puro -->
        <input type="checkbox" id="menu-toggle-checkbox" class="sr-only">

        <div class="logo">
            <a href="index.html">
                <img src="img/LOGO.png" alt="Logotipo oficial de MiProgreso">
            </a>
        </div>

        <div class="search-box">
            <label for="input-buscar" class="sr-only">Buscar</label>
            <input type="search" id="input-buscar" name="busqueda" class="form-input" placeholder="Buscar...">
        </div>

        <!-- Grupo derecho: Perfil + Botón de Hamburguesa -->
        <div class="header-right-group">
            <div class="user-profile">
                <a href="pages/perfil.html" aria-label="Menú de usuario">
                    <img src="img/perfil.png" alt="Icono de perfil de usuario">
                </a>
            </div>

            <label for="menu-toggle-checkbox" class="menu-toggle" aria-label="Abrir menú">
                <span></span>
                <span></span>
                <span></span>
            </label>
        </div>
    </header>

    <div class="app-layout">
        
        <!-- MENÚ LATERAL -->
        <nav class="main-nav" aria-label="Menú principal">
            <ul>
                <li>
                    <a href="pages/entrenar.html" class="nav-btn tarjeta-activa">
                        <img src="img/mancuerna.png" alt="" class="nav-icon">
                        <span>ENTRENAR</span>
                    </a>
                </li>
                <li>
                    <a href="pages/rutinas.html" class="nav-btn">
                        <img src="img/registro.png" alt="" class="nav-icon">
                        <span>RUTINAS</span>
                    </a>
                </li>
                <li>
                    <a href="pages/historial.html" class="nav-btn">
                        <img src="img/historial.png" alt="" class="nav-icon">
                        <span>HISTORIAL</span>
                    </a>
                </li>
                <li>
                    <a href="pages/progreso.html" class="nav-btn">
                        <img src="img/progreso.png" alt="" class="nav-icon">
                        <span>PROGRESO</span>
                    </a>
                </li>
                <li>
                    <a href="pages/perfil.html" class="nav-btn">
                        <img src="img/perfil.png" alt="" class="nav-icon">
                        <span>PERFIL</span>
                    </a>
                </li>
            </ul>
        </nav>

        <main class="main-content">

            <section class="banner-bienvenida">
                <div class="banner-texto">
                    <h2>Hola, <span class="highlight">Usuario</span>.</h2>
                    <p>¡Te damos la bienvenida a MiProgreso!</p>
                </div>

                <div class="banner-imagen">
                    <img src="img/banner.png" alt="Atletas listos para entrenar">
                </div>
            </section>

            <section class="tarjetas-dashboard">
                <article class="tarjeta tarjeta-activa">
                    <a href="pages/entrenar.html">
                        <h3>ENTRENAR</h3>
                        <img src="img/mancuerna.png" alt="Icono entrenar">
                    </a>
                </article>

                <article class="tarjeta">
                    <a href="pages/rutinas.html">
                        <h3>RUTINAS</h3>
                        <img src="img/registro.png" alt="Icono rutinas">
                    </a>
                </article>

                <article class="tarjeta">
                    <a href="pages/historial.html">
                        <h3>HISTORIAL</h3>
                        <img src="img/historial.png" alt="Icono historial">
                    </a>
                </article>
            </section>

        </main>
    </div>

    <footer>
        <div class="footer-brand">
            <img src="img/LOGO.png" alt="Logotipo MiProgreso">
            <div class="social-links">
                <a href="https://facebook.com" target="_blank" rel="noopener noreferrer" aria-label="Redes Sociales">
                    <img src="img/redes.png" alt="Redes Sociales">
                </a>
            </div>
        </div>

        <div class="footer-columns">
            <article class="columna-texto">
                <p>Texto</p>
                <p>Texto</p>
                <p>Texto</p>
            </article>
            <article class="columna-texto">
                <p>Texto</p>
                <p>Texto</p>
                <p>Texto</p>
            </article>
            <article class="columna-texto">
                <p>Texto</p>
                <p>Texto</p>
                <p>Texto</p>
            </article>
        </div>
    </footer>

</body>
</html>
