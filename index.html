<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiProgreso - Dashboard</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <header class="main-header">
        <div class="logo">
            <a href="index.html">
                <img src="img/LOGO.png" alt="Logotipo oficial de MiProgreso">
            </a>
        </div>

        <div class="search-box">
            <label for="input-buscar" class="sr-only">Buscar</label>
            <input type="search" id="input-buscar" name="busqueda" class="form-input" placeholder="Buscar...">
        </div>

        <div class="user-profile">
            <a href="perfil.html" aria-label="Menú de usuario">
                <img src="img/perfil.png" alt="Icono de perfil de usuario">
            </a>
        </div>
    </header>

    <div class="app-container">
        
        <nav class="main-nav">
            <ul>
                <li>
                    <a href="entrenar.html" class="nav-btn active">
                        <img src="img/mancuerna.png" alt="" class="nav-icon">
                        <span>ENTRENAR</span>
                    </a>
                </li>
                <li>
                    <a href="rutinas.html" class="nav-btn">
                        <img src="img/registro.png" alt="" class="nav-icon">
                        <span>RUTINAS</span>
                    </a>
                </li>
                <li>
                    <a href="historial.html" class="nav-btn">
                        <img src="img/historial.png" alt="" class="nav-icon">
                        <span>HISTORIAL</span>
                    </a>
                </li>
                <li>
                    <a href="progreso.html" class="nav-btn">
                        <img src="img/progreso.png" alt="" class="nav-icon">
                        <span>PROGRESO</span>
                    </a>
                </li>
                <li>
                    <a href="perfil.html" class="nav-btn">
                        <img src="img/perfil.png" alt="" class="nav-icon">
                        <span>PERFIL</span>
                    </a>
                </li>
            </ul>
        </nav>

        <main class="main-content">

            <section class="banner-bienvenida">
                <div class="banner-texto">
                    <h2>Hola, <span class="highlight">Usuario</span>.</h2>
                    <p>¡Te damos la bienvenida a MiProgreso!</p>
                </div>

                <div class="banner-imagen">
                    <img src="img/banner.png" alt="Atletas listos para entrenar">
                </div>
            </section>

            <section class="tarjetas-dashboard">
                <article class="tarjeta tarjeta-activa">
                    <a href="entrenar.html">
                        <h3>ENTRENAR</h3>
                        <img src="img/mancuerna.png" alt="Icono entrenar">
                    </a>
                </article>

                <article class="tarjeta">
                    <a href="rutinas.html">
                        <h3>RUTINAS</h3>
                        <img src="img/registro.png" alt="Icono rutinas">
                    </a>
                </article>

                <article class="tarjeta">
                    <a href="historial.html">
                        <h3>HISTORIAL</h3>
                        <img src="img/historial.png" alt="Icono historial">
                    </a>
                </article>
            </section>

        </main>
    </div>

    <footer>
        <div class="footer-brand">
            <img src="img/LOGO.png" alt="Logotipo MiProgreso">
            <div class="social-links">
                <a href="https://facebook.com" target="_blank" rel="noopener noreferrer" aria-label="Redes Sociales">
                    <img src="img/redes.png" alt="Redes Sociales">
                </a>
            </div>
        </div>

        <div class="footer-columns">
            <article class="columna-texto">
                <p>Texto</p>
                <p>Texto</p>
                <p>Texto</p>
            </article>
            <article class="columna-texto">
                <p>Texto</p>
                <p>Texto</p>
                <p>Texto</p>
            </article>
            <article class="columna-texto">
                <p>Texto</p>
                <p>Texto</p>
                <p>Texto</p>
            </article>
        </div>
    </footer>

</body>
</html>
