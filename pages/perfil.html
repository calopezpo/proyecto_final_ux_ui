<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Pantalla de perfil del usuario de MiProgreso">

    <title>MiProgreso - Perfil</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>

    <!-- HEADER -->
    <header class="main-header">

        <div class="logo">
            <a href="../index.html">
                <img src="../img/LOGO.png"
                    alt="Logotipo oficial de MiProgreso">
            </a>
        </div>

        <div class="search-box">
            <label for="input-buscar" class="sr-only">
                Buscar
            </label>

            <input
                type="search"
                id="input-buscar"
                name="busqueda"
                class="form-input"
                placeholder="Buscar...">
        </div>

        <div class="user-profile">
            <a href="perfil.html" aria-label="Menú de usuario">
                <img src="../img/perfil.png"
                    alt="Icono de perfil de usuario">
            </a>
        </div>

    </header>


    <!-- CONTENEDOR PRINCIPAL -->
    <div class="app-container">

        <!-- MENÚ LATERAL -->
        <nav class="main-nav" aria-label="Menú principal">

            <ul>

                <li>
                    <a href="entrenar.html" class="nav-btn">
                        <img src="../img/mancuerna.png"
                            alt=""
                            class="nav-icon">
                        <span>ENTRENAR</span>
                    </a>
                </li>

                <li>
                    <a href="rutinas.html" class="nav-btn">
                        <img src="../img/registro.png"
                            alt=""
                            class="nav-icon">
                        <span>RUTINAS</span>
                    </a>
                </li>

                <li>
                    <a href="historial.html" class="nav-btn">
                        <img src="../img/historial.png"
                            alt=""
                            class="nav-icon">
                        <span>HISTORIAL</span>
                    </a>
                </li>

                <li>
                    <a href="progreso.html" class="nav-btn">
                        <img src="../img/progreso.png"
                            alt=""
                            class="nav-icon">
                        <span>PROGRESO</span>
                    </a>
                </li>

                <li>
                    <a href="perfil.html" class="nav-btn active">
                        <img src="../img/perfil.png"
                            alt=""
                            class="nav-icon">
                        <span>PERFIL</span>
                    </a>
                </li>

            </ul>

        </nav>


        <!-- CONTENIDO DEL PERFIL -->
        <main class="main-content profile-content">

            <form class="profile-form-container">

                <div class="profile-layout">

                    <!-- INFORMACIÓN PERSONAL -->
                    <section class="profile-card">

                        <h2>Información Personal</h2>

                        <div class="profile-avatar">
                            <img src="../img/perfil.png"
                                alt="Imagen de perfil del usuario">
                        </div>

                        <h3 class="profile-name">
                            Nombre de Usuario
                        </h3>


                        <div class="profile-form">

                            <!-- CORREO -->
                            <div class="profile-field">

                                <div class="profile-field-info">

                                    <label for="correo">
                                        Dirección email
                                    </label>

                                    <input
                                        type="email"
                                        id="correo"
                                        name="correo"
                                        value="User124@email.com">

                                </div>

                                <button
                                    class="edit-btn"
                                    type="button">
                                    Editar
                                </button>

                            </div>


                            <!-- TELÉFONO -->
                            <div class="profile-field">

                                <div class="profile-field-info">

                                    <label for="telefono">
                                        Número de Teléfono
                                    </label>

                                    <input
                                        type="tel"
                                        id="telefono"
                                        name="telefono"
                                        value="0912345678">

                                </div>

                                <button
                                    class="edit-btn"
                                    type="button">
                                    Editar
                                </button>

                            </div>


                            <!-- FECHA DE NACIMIENTO -->
                            <div class="profile-field">

                                <div class="profile-field-info">

                                    <label for="fecha">
                                        Fecha de nacimiento
                                    </label>

                                    <input
                                        type="date"
                                        id="fecha"
                                        name="fecha"
                                        value="2001-01-01">

                                </div>

                                <button
                                    class="edit-btn"
                                    type="button">
                                    Editar
                                </button>

                            </div>

                        </div>

                    </section>


                    <!-- BOTÓN CENTRAL -->
                    <section
                        class="save-area"
                        aria-label="Guardar cambios">

                        <button
                            class="save-btn"
                            type="submit">
                            Guardar<br>
                            Cambios
                        </button>

                    </section>


                    <!-- PREFERENCIAS -->
                    <section class="preferences-card">

                        <h2>Preferencias del Sistema</h2>


                        <!-- TEMA -->
                        <div class="preference-item">

                            <label>Tema</label>

                            <div class="theme-options">

                                <span class="theme-option">
                                    ☀ Claro
                                </span>

                                <span class="theme-option active">
                                    ☾ Oscuro
                                </span>

                            </div>

                        </div>


                        <!-- IDIOMA -->
                        <div class="preference-item">

                            <label for="idioma">
                                Idioma
                            </label>

                            <select
                                id="idioma"
                                name="idioma">

                                <option selected>
                                    Español
                                </option>

                                <option>
                                    English
                                </option>

                            </select>

                        </div>


                        <!-- RECOMENDACIÓN -->
                        <div class="preference-item">

                            <label for="recomendacion">
                                Recomendación de Entrenamiento
                            </label>

                            <select
                                id="recomendacion"
                                name="recomendacion">

                                <option selected>
                                    Diario
                                </option>

                                <option>
                                    Semanal
                                </option>

                                <option>
                                    Personalizado
                                </option>

                            </select>

                        </div>


                        <!-- UNIDAD -->
                        <div class="preference-item">

                            <label for="unidad">
                                Unidad de medida
                            </label>

                            <select
                                id="unidad"
                                name="unidad">

                                <option selected>
                                    Kilogramos (kg)
                                </option>

                                <option>
                                    Libras (lb)
                                </option>

                            </select>

                        </div>


                        <!-- FORMATO FECHA -->
                        <div class="preference-item">

                            <label>
                                Formato de Fecha
                            </label>

                            <div class="date-format">

                                <strong>
                                    DD/MM/AAAA
                                </strong>

                                <span>
                                    MM/DD/AAAA
                                </span>

                            </div>

                        </div>


                        <!-- NOTIFICACIONES -->
                        <div class="preference-item">

                            <label>
                                Notificaciones
                            </label>

                            <div class="notification-options">

                                <span class="notification-option active">
                                    Activado
                                </span>

                                <span class="notification-option">
                                    Desactivado
                                </span>

                            </div>

                        </div>

                    </section>

                </div>

            </form>

        </main>

    </div>


    <!-- FOOTER -->
    <footer>

        <div class="footer-brand">

            <img src="../img/LOGO.png"
                alt="Logotipo MiProgreso">

            <div class="social-links">

                <a href="https://facebook.com"
                    target="_blank"
                    rel="noopener noreferrer"
                    aria-label="Redes Sociales">

                    <img src="../img/redes.png"
                        alt="Redes Sociales">

                </a>

            </div>

        </div>


        <div class="footer-columns">

            <article class="columna-texto">
                <p>Texto</p>
                <p>Texto</p>
                <p>Texto</p>
            </article>

            <article class="columna-texto">
                <p>Texto</p>
                <p>Texto</p>
                <p>Texto</p>
            </article>

            <article class="columna-texto">
                <p>Texto</p>
                <p>Texto</p>
                <p>Texto</p>
            </article>

        </div>

    </footer>

</body>

</html>
