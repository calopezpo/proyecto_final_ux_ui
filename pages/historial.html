<!DOCTYPE html>
<html lang="es">
<head>

    <meta name="description" content="Historial de entrenamientos - MiProgreso">
    <meta name="author" content="Carlos López, Matías Mite, Rafael Chiriboga">
    <title>MiProgreso | Historial</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../css/styles.css">

<body>

    <header class="main-header">
        <!-- Checkbox invisible para controlar el menú hamburguesa por CSS puro -->
        <input type="checkbox" id="menu-toggle-checkbox" class="sr-only">

        <div class="logo">
            <a href="../index.html">
                <img src="../img/LOGO.png" alt="Logotipo oficial de MiProgreso">
            </a>
        </div>
        
        <div class="search-box">
            <label for="input-buscar" class="sr-only">Buscar</label>
            <input type="search" id="input-buscar" name="busqueda" class="form-input" placeholder="Buscar...">
        </div>

        <!-- Grupo derecho: Perfil + Botón de Hamburguesa -->
        <div class="header-right-group">
            <div class="user-profile">
                <a href="../pages/perfil.html" aria-label="Menú de usuario">
                    <img src="../img/perfil.png" alt="Icono de perfil de usuario">
                </a>
            </div>

            <label for="menu-toggle-checkbox" class="menu-toggle" aria-label="Abrir menú">
                <span></span>
                <span></span>
                <span></span>
            </label>
        </div>
    </header>

    <div class="app-layout">
        
        <!-- MENÚ LATERAL -->
        <nav class="main-nav" aria-label="Menú principal">
            <ul>
                <li>
                    <a href="../pages/entrenar.html" class="nav-btn">
                        <img src="../img/mancuerna.png" alt="" class="nav-icon">
                        <span>ENTRENAR</span>
                    </a>
                </li>
                <li>
                    <a href="../pages/rutinas.html" class="nav-btn">
                        <img src="../img/registro.png" alt="" class="nav-icon">
                        <span>RUTINAS</span>
                    </a>
                </li>
                <li>
                    <a href="../pages/historial.html" class="nav-btn tarjeta-activa">
                        <img src="../img/historial.png" alt="" class="nav-icon">
                        <span>HISTORIAL</span>
                    </a>
                </li>
                <li>
                    <a href="../pages/progreso.html" class="nav-btn">
                        <img src="../img/progreso.png" alt="" class="nav-icon">
                        <span>PROGRESO</span>
                    </a>
                </li>
                <li>
                    <a href="../pages/perfil.html" class="nav-btn tarjeta-activa">
                        <img src="../img/perfil.png" alt="" class="nav-icon">
                        <span>PERFIL</span>
                    </a>
                </li>
            </ul>
        </nav>

        <main class="main-content">
            <section aria-labelledby="titulo-historial">
                <div class="content-header">
                    <h1 id="titulo-historial">HISTORIAL</h1>
                    
                    <div class="search-ejercicio">
                        <label for="buscar-ejercicio" class="sr-only">Buscar ejercicio</label>
                        <input type="search" id="buscar-ejercicio" placeholder="Buscar ejercicio...">
                    </div>
                </div>

                <div class="cards-container">
                    <article class="tarjeta-historial">
                        <div class="columna-dato">
                            <span>Fecha</span>
                            <span>07/02/26</span>
                        </div>
                        <div class="columna-dato">
                            <span>Rutina</span>
                            <span class="highlight">Full Body</span>
                        </div>
                        <div class="columna-dato">
                            <span>Duración</span>
                            <span>120min</span>
                        </div>
                    </article>
                    
                    <article class="tarjeta-historial">
                        <div class="columna-dato">
                            <span>Fecha</span>
                            <span>07/02/26</span>
                        </div>
                        <div class="columna-dato">
                            <span>Rutina</span>

                        </div>
                        <div class="columna-dato">
                            <span>Duración</span>
                            <span>120min</span>
                        </div>
                    </article>

                    <article class="tarjeta-historial">
                        <div class="columna-dato">

                        </div>
                        <div class="columna-dato">

                            <span class="highlight">Push Day</span>
                        </div>
                        <div class="columna-dato">
                            <span>Duración</span>
                            <span>120min</span>
                        </div>
                    </article>
                </div>
            </section>
        </main>
    </div>

    <footer>
        <div class="footer-brand">
            <img src="../img/LOGO.png" alt="Logotipo MiProgreso">
            <div class="social-links">
                <a href="https://facebook.com" target="_blank" rel="noopener noreferrer" aria-label="Redes Sociales">
                    <img src="../img/redes.png" alt="Redes Sociales">
                </a>

        <div class="footer-columns">
            <article class="columna-texto">

            <article class="columna-texto">

            <article class="columna-texto">
